# Set the prefix to `ctrl + space` instead of `ctrl + b`
unbind C-b
set -g prefix C-space
bind C-space send-prefix

#utf setting
set-option -g status on
set-window-option -g mode-keys vi

# Automatically set window title
set-window-option -g automatic-rename off
set-option -g set-titles on

set -s escape-time 0

# 256色ターミナル + True Color対応
set-option -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*-256color:Tc'

# 下線の色指定 (SGR 58)。Alacritty 本体は対応しているが同梱 terminfo が Setulc を
# 持たないため、tmux が下線色の出し方を知らず SGR 58 を握り潰してしまい、
# nvim の LSP 診断などで波線が色分けされない。ここで色指定だけを補う。
# 波線そのものは alacritty terminfo の Smulx で出るので上書き不要。
# コロンは `::` と重ねて書く。`\:` はこの tmux では区切り文字として扱われ、
# 値が `\E[58` で切り詰められる（実測）。
set -ga terminal-overrides ',alacritty:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# 異体字セレクタ(VS16)を幅1として扱う（tmux 3.6+）
# Alacrittyなど新しいターミナルでは絵文字+VS16が1文字幅として表示されるため
set -s variation-selector-always-wide off

# default Shell ZSH!
set-option -g default-shell $SHELL

# Scroll
set -g mouse on

# クリップボードへの書き込みは pbcopy に一本化する。
# tmux 既定の set-clipboard=external だと、コピー時に pbcopy と OSC 52（Alacritty 経由）が
# 同じ NSPasteboard へ同時に書き込み、clearContents と writeObjects の間で changeCount が
# ずれて Alacritty 側が「NSPasteboard#writeObjects: returned false」を散発的に警告する。
set -s set-clipboard off

# drag & copy
bind-key -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e; send-keys -M'"
bind-key -n WheelDownPane select-pane -t= \; send-keys -M

# ドラッグ選択後にコピーモードを抜けない（最下部へのジャンプ防止）
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe "pbcopy"
# tmux-yank にもコピー後にコピーモードを維持させる
set -g @yank_action 'copy-pipe'

setw -g mode-keys vi
unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
# bind-key -t vi-copy 'v' begin-selection
# bind-key -t vi-copy 'y' copy-selection
# # copy tmux buffer to clipboard
 # bind C-y run "tmux show-buffer | xsel -b"
# # # move x clipboard into tmux paste buffer
 # bind C-p run "tmux set-buffer \"$(xsel -o)\"; tmux paste-buffer"

# | でペインを垂直分割（カレントディレクトリ維持）
bind | split-window -h -c "#{pane_current_path}"
# - でペインを水平分割（カレントディレクトリ維持）
bind - split-window -v -c "#{pane_current_path}"

# samaple
setw -g monitor-activity on
set -g visual-activity on
setw -g automatic-rename

# Ctrl-t -> sで同期モードの設定を切り替える
bind s set -g synchronize-panes

## tmux-open
set -g @open-S 'https://www.google.com/search?q='

#############################
##   Tmux Plugin Manager   ##
#############################

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'arcticicestudio/nord-tmux'
set -g @plugin 'nhdaly/tmux-scroll-copy-mode'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '${XDG_CONFIG_HOME}/tmux/plugins/tpm/tpm'

# プラグイン読み込み後に上書きされないよう最後に再バインド
# Esc / q でコピーモードを抜ける（デフォルトの Escape は clear-selection）
unbind-key -T copy-mode-vi Escape
bind-key   -T copy-mode-vi Escape send-keys -X cancel
bind-key   -T copy-mode-vi q      send-keys -X cancel

# prefix + E で、現在のペインに対してEnterを定期送信するペインを横分割で起動
bind-key E run-shell -b "tmux split-window -v -l 3 '#{E:XDG_CONFIG_HOME}/tmux/keepalive.sh #{pane_id}'"

# prefix + H で、過去の user_prompt を fzf + DuckDB で検索する popup を起動。
# 将来 prompt-snippet.sh は prefix + S にバインド予定（スニペット化したプロンプト検索）。
# Claude Code が稼働中のペインの上に重ねて表示されるため、ホスト側の入力と干渉しない。
# Note: パスは展開せずリテラル指定（ #{E:XDG_CONFIG_HOME} 経由だと一部環境で空展開する事例があったため）。
# Style: Catppuccin Mocha — mauve border / title。fzf 側のテーマと色を合わせる。
bind-key H display-popup \
  -w 90% -h 90% \
  -b rounded \
  -T "#[fg=#cba6f7,bold] ✨ Prompt History " \
  -S "fg=#cba6f7" \
  -E "$HOME/.config/tmux/prompt-history.sh"
