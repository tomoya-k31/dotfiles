onboarding = false

[ui]
agent_panel_sort = "spaces"
show_agent_labels_on_pane_borders = true

# サイドバーの幅
sidebar_width = 44
sidebar_max_width = 44

[ui.toast]
delivery = "system"

# totsuka が dispatch 時に報告する identity token を出す（totsuka #417）。
# $repo / $task / $mode は totsuka の workspace / pane にだけ載るので、
# 自分で開いた space では空になる。だから 1 行目には組み込みトークンを混ぜる。
# 手順と切り分け: totsuka の docs/operations/herdr-sidebar-setup.md
# branch / git_status は space 単位のトークンなので、1 つの space に別リポジトリの
# tab がぶら下がると「どれの branch なのか」が言えなくなる。出さない。
# $repo も出さない — rename 後の workspace label が repo で始まるので重複する。
[ui.sidebar.spaces]
row_gap = 0
rows = [["state_icon", "workspace"]]

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", { token = "$repo", fg = "#89b4fa", bold = true }, "agent"],
  [{ token = "workspace", dim = true }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [
    "state_icon",
    { token = "$repo", fg = "#89b4fa", bold = true },
    { token = "$mode", fg = "#f9e2af" },
    { token = "terminal_title_stripped", fg = "#a6adc8" },
  ],
  [{ token = "workspace", dim = true }],
]

[experimental]
switch_ascii_input_source_in_prefix = true

[theme]
name = "catppuccin"
auto_switch = false

[remote]
manage_ssh_config = true
